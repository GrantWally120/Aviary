# Windows build from a clean checkout. Personal Collection payloads stay off GitHub.
name: Build Aviary (win-x64)
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: pwsh
env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  DOTNET_NOLOGO: 'true'
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Restore the locked package graph
        run: |
          dotnet restore src/Aviary/Aviary.csproj --locked-mode -p:Platform=x64 -p:RuntimeIdentifier=win-x64
          if ($LASTEXITCODE) { throw 'Restore failed' }
      - name: Check settings, player actions, filter engine and Collection safety
        run: |
          node tools/test/settings-audit.js
          if ($LASTEXITCODE) { throw 'Settings audit failed' }
          node tools/test/m7-script-test.js
          if ($LASTEXITCODE) { throw 'Player checks failed' }
          node tools/test/collection-availability-test.js
          if ($LASTEXITCODE) { throw 'Collection checks failed' }
          dotnet run --project tools/test/filters/FilterHarness.csproj -c Release
          if ($LASTEXITCODE) { throw 'Filter checks failed' }
          ./tools/test/library-sync-test.ps1
      - name: Prepare and verify the source-only app
        run: ./tools/release/prepare.ps1 -NoRestore -SourceOnly -OutputRoot .artifact/release-ci
      - name: Upload the app
        uses: actions/upload-artifact@v7
        with:
          path: .artifact/release-ci/Aviary-AB5-RC-source-win-x64.zip
          archive: false
          if-no-files-found: error
          retention-days: 14
      - name: Upload file manifest and checksum
        uses: actions/upload-artifact@v7
        with:
          name: Aviary-build-evidence
          path: |
            .artifact/release-ci/manifest.json
            .artifact/release-ci/*.sha256
          if-no-files-found: error
          retention-days: 14
